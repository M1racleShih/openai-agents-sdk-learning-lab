site_name: Agents SDK Learning Lab
site_description: Build a bounded, read-only evidence worker with the OpenAI Agents SDK.
site_url: https://m1racleshih.github.io/openai-agents-sdk-learning-lab/
repo_url: https://github.com/M1racleShih/openai-agents-sdk-learning-lab
repo_name: M1racleShih/openai-agents-sdk-learning-lab
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

nav:
  - 课程首页: index.md
  - 教材站使用说明: site-guide.md
  - M00 · 第一次运行 Agent: lessons/m00-first-agent.md
  - M01 · 结构化结果与上下文: lessons/m01-structured-results-and-context.md
  - M02 · 有边界的只读工具: lessons/m02-read-only-tools.md
  - M03 · 有界运行与真实失败: lessons/m03-bounded-runs-and-failures.md
  - M04 · 脱敏追踪与确定性测试: lessons/m04-tracing-and-testing.md
  - M05 · JSON 证据工作器: lessons/m05-json-evidence-worker.md
  - M06 · 目标项目就绪评审: lessons/m06-readiness-review.md

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/compass-rose
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换主题 / Switch theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换主题 / Switch theme

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            课程首页: Course home
            教材站使用说明: Lesson site guide
            M00 · 第一次运行 Agent: M00 · Run your first Agent
            M01 · 结构化结果与上下文: M01 · Structured results and context
            M02 · 有边界的只读工具: M02 · Bounded read-only tools
            M03 · 有界运行与真实失败: M03 · Bounded runs and truthful failures
            M04 · 脱敏追踪与确定性测试: M04 · Redacted tracing and deterministic tests
            M05 · JSON 证据工作器: M05 · JSON evidence worker
            M06 · 目标项目就绪评审: M06 · Target-project readiness review

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/reading-progress.js

extra:
  generator: false

copyright: OpenAI Agents SDK Learning Lab · SDK v0.19.1 · MIT License
