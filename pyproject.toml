[project]
name = "openai-agents-sdk-learning-lab"
version = "0.1.0"
description = "A focused learning lab for bounded read-only workers built with the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents==0.19.1",
]

[dependency-groups]
dev = [
    "mkdocs-material==9.7.7",
    "mkdocs-static-i18n==1.3.1",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_worker"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
